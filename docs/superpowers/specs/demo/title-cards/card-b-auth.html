<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toodles — Authentication</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #fafafa;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden; }
  .slide {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 6rem;
  }
  .accent {
    color: #ff6b6b; font-size: 2.2rem; font-weight: 300;
    letter-spacing: 0.3rem; text-transform: uppercase;
    margin-bottom: 3rem;
  }
  .main {
    font-size: 4rem; font-weight: 200;
    max-width: 75%; line-height: 1.35;
  }
  .domain { color: #ff6b6b; font-weight: 300; }
</style>
</head>
<body>
<div class="slide">
  <div class="accent">Authentication</div>
  <div class="main">Firebase Auth, domain-restricted to <br><span class="domain">@csu.fullerton.edu</span></div>
</div>
</body>
</html>
