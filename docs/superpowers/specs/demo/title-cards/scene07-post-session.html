<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene 7 — Post-Session Feedback</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #faf6f1; /* cream, matches the other phone-frame screenshots */
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .phone {
    width: 380px; height: 780px;
    background: linear-gradient(135deg, #2b8fff 0%, #3b76d8 50%, #65adff 100%);
    border-radius: 48px;
    border: 8px solid #0b0b12;
    overflow: hidden;
    box-shadow: 0 28px 60px rgba(0,0,0,0.25);
    position: relative;
  }
  .notch {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px;
    background: #0b0b12;
    border-radius: 18px;
  }
  .status {
    position: absolute; top: 22px; left: 32px; right: 32px;
    display: flex; justify-content: space-between;
    color: white; font-size: 15px; font-weight: 600;
  }
  .status .right { font-size: 13px; }
  .content {
    position: absolute; inset: 60px 0 0 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 18px 20px;
    color: white;
  }
  .photo {
    width: 160px; height: 160px;
    border-radius: 50%;
    background: url('https://randomuser.me/api/portraits/women/44.jpg') center/cover;
    border: 4px solid rgba(255,255,255,0.65);
    box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    margin-top: 8px;
  }
  .name {
    font-size: 30px; font-weight: 900; margin-top: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .subtitle {
    font-size: 13px; opacity: 0.9; margin-top: 4px;
  }
  .prompt {
    font-size: 17px; font-weight: 700;
    margin-top: 26px; opacity: 0.95;
  }
  .row {
    display: flex; gap: 14px; margin-top: 22px;
  }
  .btn {
    width: 90px; height: 90px;
    border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    color: white;
    border: 1px solid rgba(255,255,255,0.35);
    font-size: 11px; font-weight: 700;
  }
  .btn .icon { font-size: 28px; }
  .btn.like {
    background: #f55a8b;
    border-color: white;
    box-shadow: 0 6px 16px rgba(245, 90, 139, 0.5);
    transform: scale(1.05);
  }
  .btn.pass {
    background: rgba(255,255,255,0.22);
  }
  .btn.report {
    background: rgba(255,255,255,0.22);
  }
  .footer {
    position: absolute; bottom: 26px; left: 24px; right: 24px;
    font-size: 10px; text-align: center; opacity: 0.7;
    color: white;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:12</span><span class="right">• • • 📶 🔋</span></div>
  <div class="content">
    <div class="photo"></div>
    <div class="name">Emma Chen</div>
    <div class="subtitle">CSU Fullerton · Junior · Nursing</div>
    <div class="prompt">How was your chat?</div>
    <div class="row">
      <div class="btn like"><div class="icon">♥</div>Like</div>
      <div class="btn pass"><div class="icon">✕</div>Pass</div>
      <div class="btn report"><div class="icon">⚑</div>Report</div>
    </div>
  </div>
  <div class="footer">Your response is private. The other person can't see it.</div>
</div>
</body>
</html>
