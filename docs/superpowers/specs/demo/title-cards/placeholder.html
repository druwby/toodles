<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Placeholder</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1a1a1a; color: #fafafa;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden; }
  .slide {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 6rem;
    background: repeating-linear-gradient(45deg, #1a1a1a 0 40px, #222 40px 80px);
  }
  .note {
    background: rgba(10, 10, 10, 0.9);
    border: 2px dashed #ff6b6b;
    padding: 3rem 5rem;
    border-radius: 14px;
    font-size: 2.4rem; font-weight: 300;
    letter-spacing: 0.1rem;
  }
  .note small {
    display: block; margin-top: 1rem;
    font-size: 1.4rem; font-weight: 400;
    opacity: 0.65; text-transform: uppercase; letter-spacing: 0.3rem;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="note">
    Appetize footage will go here
    <small>Record in OBS, drop into raw/ folder, rerun assemble.ps1</small>
  </div>
</div>
</body>
</html>
