<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toodles — 60 Seconds</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #fafafa;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden; }
  .slide {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 6rem;
  }
  .accent {
    color: #ff6b6b; font-size: 2.2rem; font-weight: 300;
    letter-spacing: 0.3rem; text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  .big {
    font-size: 10rem; font-weight: 100;
    color: #ff6b6b; line-height: 1;
    margin-bottom: 2rem;
    letter-spacing: 0.1rem;
  }
  .row {
    font-size: 2rem; font-weight: 300;
    margin: 0.6rem 0; opacity: 0.9;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="accent">The Core Experience</div>
  <div class="big">60 seconds</div>
  <div class="row">Peer-to-Peer WebRTC via Daily.co</div>
  <div class="row">Server-enforced room lifecycle</div>
</div>
</body>
</html>
