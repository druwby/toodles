<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toodles — Tech Stack</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; color: #fafafa;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden; }
  .slide {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 6rem;
  }
  h1 {
    font-size: 6rem; font-weight: 200;
    letter-spacing: 0.3rem; margin: 0 0 4rem;
    color: #ff6b6b;
  }
  .row {
    font-size: 2.2rem; font-weight: 300;
    margin: 1.8rem 0; letter-spacing: 0.05rem;
  }
  .sep { color: #ff6b6b; margin: 0 1.25rem; }
  .small {
    font-size: 1.5rem; margin-top: 4rem;
    opacity: 0.65; font-style: italic;
    letter-spacing: 0.2rem; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">
  <h1>Built With</h1>
  <div class="row">iOS <span class="sep">·</span> SwiftUI <span class="sep">·</span> Combine</div>
  <div class="row">Firebase Auth <span class="sep">·</span> Firestore <span class="sep">·</span> Storage <span class="sep">·</span> Cloud Functions</div>
  <div class="row">Daily.co <span class="sep">—</span> Peer-to-Peer WebRTC Video</div>
  <div class="small">MVVM Architecture</div>
</div>
</body>
</html>
