name: Toodles
options:
  bundleIdPrefix: edu.csuf.toodles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_BUNDLE_IDENTIFIER: edu.csuf.toodles
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEMO_MODE"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
targets:
  Toodles:
    type: application
    platform: iOS
    sources:
      - path: Toodles
        excludes:
          - "**/.DS_Store"
          # _Reference/ holds harvested Daily.co code that imports `Daily` —
          # re-added behind #if !DEMO_MODE in Phase 7.
          - "_Reference/**"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    info:
      path: Toodles/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "Toodles needs camera access to show your video in calls."
        NSMicrophoneUsageDescription: "Toodles needs microphone access for video calls."
        NSPhotoLibraryUsageDescription: "Toodles needs photo library access to upload your profile picture."
        CFBundleDisplayName: Toodles
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  # TDV-85 — XCTest target for v1.1 unit tests. Covers the pure-function
  # services added in Subprojects A, B, D, E (MatchScorer, IcebreakerService,
  # TrustEvent model, TranscriptService synthetic path). Integration tests
  # against Firestore require the emulator and are out of scope for v1.1.
  ToodlesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ToodlesTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Toodles
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Toodles.app/Toodles"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEMO_MODE"
