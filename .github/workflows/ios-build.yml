name: iOS Build
on:
  push:
    branches: [integration, main, develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Select newest available Xcode
        run: |
          # Prefer Xcode 16.x (matches the project format XcodeGen produces).
          # Fall back to the newest installed Xcode of any version.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting Xcode at: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # GoogleService-Info.plist is gitignored (TDV-85). Inject from an
      # optional repository secret so CI builds can talk to Firebase.
      # When the secret isn't set, the app still builds and launches, just
      # with Firebase disabled — ToodlesApp.init guards on the plist path.
      - name: Write GoogleService-Info.plist from secret (optional)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$PLIST_B64" ]; then
            echo "$PLIST_B64" | base64 -d > Toodles/Resources/GoogleService-Info.plist
            echo "Firebase plist injected from secret."
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST_B64 secret configured — Firebase features will be disabled in this build."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (Subprojects A/B/D/E)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Toodles.xcodeproj \
            -scheme Toodles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build-tests/ \
            2>&1 | tail -300

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Toodles.xcodeproj \
            -scheme Toodles

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Toodles.xcodeproj \
            -scheme Toodles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ \
            build 2>&1 | tail -300

      - name: Zip simulator .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Toodles.app.zip Toodles.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toodles-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/Toodles.app.zip
          retention-days: 7
