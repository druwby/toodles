name: iOS Build
on:
  push:
    branches: [integration, main, develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Select newest available Xcode
        run: |
          # Prefer Xcode 16.x (matches the project format XcodeGen produces).
          # Fall back to the newest installed Xcode of any version.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting Xcode at: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # GoogleService-Info.plist is gitignored (TDV-85). Inject from an
      # optional repository secret so CI builds can talk to Firebase.
      # When the secret isn't set, the app still builds and launches, just
      # with Firebase disabled — ToodlesApp.init guards on the plist path.
      - name: Write GoogleService-Info.plist from secret (optional)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$PLIST_B64" ]; then
            echo "$PLIST_B64" | base64 -d > Toodles/Resources/GoogleService-Info.plist
            echo "Firebase plist injected from secret."
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST_B64 secret configured — Firebase features will be disabled in this build."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Toodles.xcodeproj \
            -scheme Toodles

      - name: Resolve a concrete simulator for tests
        id: simctl
        run: |
          # macOS runner images rotate which iPhone models ship by default;
          # pinning a specific name (e.g. "iPhone 15") breaks whenever the
          # image upgrades. Instead, boot whichever iPhone the latest runtime
          # provides. Prefers iPhone 16 Pro if present, falls back to the
          # first iPhone the runtime lists.
          LATEST_RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; runtimes=json.load(sys.stdin)['runtimes']; ios=[r for r in runtimes if r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS') and r.get('isAvailable')]; print(sorted(ios, key=lambda r:r['version'])[-1]['identifier'])")
          echo "runtime=$LATEST_RUNTIME"
          DEVICE_UDID=$(xcrun simctl list devices -j "$LATEST_RUNTIME" | python3 -c "import json,sys; devs=json.load(sys.stdin)['devices']; pool=next(iter(devs.values())); pref=[d for d in pool if d['name']=='iPhone 16 Pro' and d.get('isAvailable')]; any=[d for d in pool if d['name'].startswith('iPhone') and d.get('isAvailable')]; print((pref or any)[0]['udid'])")
          echo "udid=$DEVICE_UDID"
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (Subprojects A/B/D/E)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Toodles.xcodeproj \
            -scheme Toodles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simctl.outputs.udid }}" \
            -derivedDataPath build-tests/ \
            2>&1 | tail -300

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Toodles.xcodeproj \
            -scheme Toodles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ \
            build 2>&1 | tail -300

      - name: Zip simulator .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Toodles.app.zip Toodles.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toodles-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/Toodles.app.zip
          retention-days: 7
