name: iOS Build
on:
  push:
    branches: [integration, main, develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Select newest available Xcode
        run: |
          # Prefer Xcode 16.x (matches the project format XcodeGen produces).
          # Fall back to the newest installed Xcode of any version.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting Xcode at: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # GoogleService-Info.plist is gitignored (TDV-85). Two injection paths:
      #  1. Real plist from GOOGLE_SERVICE_INFO_PLIST_B64 secret — used for
      #     production-like CI runs where Firebase should actually work.
      #  2. Format-valid fake plist — used when no secret is set, so
      #     FirebaseApp.configure() succeeds at app launch and Firestore.firestore()
      #     doesn't crash in constructor-level property initializers like
      #     FirestoreService.shared. Real network calls against Firestore would
      #     fail, but the pure-function unit tests don't make any.
      - name: Write GoogleService-Info.plist
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          PLIST_PATH=Toodles/Resources/GoogleService-Info.plist
          if [ -n "$PLIST_B64" ]; then
            echo "$PLIST_B64" | base64 -d > "$PLIST_PATH"
            echo "Firebase plist injected from secret."
          else
            cat > "$PLIST_PATH" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key><string>CI_PLACEHOLDER_API_KEY</string>
              <key>GCM_SENDER_ID</key><string>000000000000</string>
              <key>PLIST_VERSION</key><string>1</string>
              <key>BUNDLE_ID</key><string>edu.csuf.toodles</string>
              <key>PROJECT_ID</key><string>toodles-ci</string>
              <key>STORAGE_BUCKET</key><string>toodles-ci.appspot.com</string>
              <key>IS_ADS_ENABLED</key><false/>
              <key>IS_ANALYTICS_ENABLED</key><false/>
              <key>IS_APPINVITE_ENABLED</key><true/>
              <key>IS_GCM_ENABLED</key><true/>
              <key>IS_SIGNIN_ENABLED</key><true/>
              <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          PLIST_EOF
            echo "No secret set — wrote format-valid placeholder plist so FirebaseApp.configure() succeeds for tests."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Toodles.xcodeproj \
            -scheme Toodles

      - name: Create a simulator for tests
        id: simctl
        shell: bash
        run: |
          set -e
          # Don't enumerate existing simulators — runner image rotations make
          # device-name filtering fragile. Instead, create a fresh simulator
          # from a device-type ID + the latest iOS runtime, both of which
          # are stable IDs across image revisions.
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import json, sys
          r = [x for x in json.load(sys.stdin)['runtimes']
               if 'SimRuntime.iOS' in x.get('identifier', '')
               and x.get('isAvailable')]
          r.sort(key=lambda x: tuple(int(p) for p in x.get('version', '0.0').split('.')))
          print(r[-1]['identifier'])
          ")
          echo "runtime=$RUNTIME"

          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          d = [x for x in json.load(sys.stdin)['devicetypes']
               if 'iPhone' in x.get('name', '')]
          # Prefer iPhone 16 Pro; if absent, fall back to whichever iPhone
          # sorts latest alphanumerically (usually the newest model).
          pref = [x for x in d if x['name'] == 'iPhone 16 Pro']
          chosen = pref[0] if pref else sorted(d, key=lambda x: x['name'])[-1]
          print(chosen['identifier'])
          ")
          echo "device_type=$DEVICE_TYPE"

          UDID=$(xcrun simctl create "CI-Test-$(date +%s)" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (Subprojects A/B/D/E)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Toodles.xcodeproj \
            -scheme Toodles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simctl.outputs.udid }}" \
            -derivedDataPath build-tests/ \
            2>&1 | tail -300

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Toodles.xcodeproj \
            -scheme Toodles \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ \
            build 2>&1 | tail -300

      - name: Zip simulator .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Toodles.app.zip Toodles.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toodles-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/Toodles.app.zip
          retention-days: 7
